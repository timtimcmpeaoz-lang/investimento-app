
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Aplicativo</title>
  <meta name="theme-color" content="#1565c0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 30px 16px;
    }
    main {
      max-width: 420px;
      margin: 40px auto;
      padding: 24px;
      background: #1e293b;
      border-radius: 16px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    #resultado { font-size: 22px; }
  </style>
</head>
<body>
  <main>
    <h1>Meu Aplicativo</h1>
    <p>Meu primeiro aplicativo Android</p>
    <input id="nome" placeholder="Digite seu nome">
    <button onclick="salvar()">Salvar no celular</button>
    <p id="resultado"></p>
  </main>
  <script>
    const campo = document.getElementById("nome");
    const resultado = document.getElementById("resultado");
    campo.value = localStorage.getItem("meuNome") || "";

    function salvar() {
      localStorage.setItem("meuNome", campo.value);
      resultado.textContent = "Salvo com sucesso!";
    }
  </script>
</body>
</html>
